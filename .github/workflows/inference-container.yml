name: Wisconsin model training-to-serving container and monitoring
env:
  PYTHONPATH: src
on:
  push:
    branches: [main]
    paths:
      - "src/hchealth/service.py"
      - "src/hchealth/train.py"
      - "tests/test_service.py"
      - "requirements-serving.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/inference-container.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-http-and-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install container-equivalent serving dependencies
        run: |
          python -m pip install -r requirements-serving.txt
          python -m pip install pytest
      - name: Assert saved model, source labels and live HTTP monitoring contracts
        run: python -m pytest -q tests/test_service.py
      - name: Train all five classifiers and training-only monitoring envelope from original public Wisconsin data
        run: python -m hchealth.train --config configs/ci_demo.yaml
      - name: Verify trained model, reference provenance and inference directly
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from sklearn.datasets import load_breast_cancer
          from hchealth.service import ServingModel
          from hchealth.data import load_tabular
          p=Path("runs/ci_demo")
          ref=json.loads((p/"monitoring_reference.json").read_text())
          model=ServingModel(p)
          train, test, _, _=load_tabular()
          assert ref["n_training_rows"] == len(train) == model.meta["n_train"]
          assert model.meta["n_test"]==len(test)==114
          assert ref["features"]==list(train.columns)
          assert model.feature_names==list(load_breast_cancer(as_frame=True).feature_names)
          result=model.predict(test.iloc[:12].to_dict("records"))
          assert len(result["research_probability_malignant"])==12
          assert model.metrics()["observations"]==12
          assert model.metrics()["feature_cells_evaluated"]==360
          print("Actual original data -> training-only source envelope -> fitted model -> 12 true heldout public rows -> aggregate monitor validated")
          PY
      - name: Build real train-inside-image deployment package
        run: docker build -t wisconsin-research-ml:ci .
      - name: Run local container and verify actual HTTP inference + metrics
        run: |
          docker run --rm --detach --name wisconsin-demo -p 127.0.0.1:8002:8000 wisconsin-research-ml:ci
          trap 'docker rm -f wisconsin-demo || true' EXIT
          python - <<'PY'
          import json, time, urllib.request
          from sklearn.datasets import load_breast_cancer
          url="http://127.0.0.1:8002"
          for _ in range(100):
              try:
                  with urllib.request.urlopen(url+"/health",timeout=4) as r:
                      data=json.load(r)
                  assert data["status"]=="ok"
                  break
              except Exception:
                  time.sleep(.4)
          else:
              raise RuntimeError("Container did not start")
          dataset=load_breast_cancer(as_frame=True)
          record=dataset.data.iloc[0].to_dict()
          request=urllib.request.Request(url+"/predict",
              data=json.dumps({"records":[record]}).encode(),
              headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(request,timeout=30) as r:
              pred=json.load(r)
          assert len(pred["research_probability_malignant"])==1
          assert pred["malignant_positive_label"]==1
          assert pred["clinical_decision_support"] is False
          with urllib.request.urlopen(url+"/metrics",timeout=3) as r:
              metrics=json.load(r)
          assert metrics["observations"]==1
          assert sum(metrics["probability_bins_0_20_40_60_80_100"])==1
          assert metrics["monitoring_excludes_raw_records"] is True
          print("TRUE CONTAINER POST /predict + GET /metrics VERIFIED",data["model"])
          PY
          mkdir -p docs/screenshots
          BROWSER=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -n "$BROWSER" ]; then
            "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage \
              --window-size=1440,1050 \
              --screenshot="$PWD/docs/screenshots/real-wisconsin-fastapi-docs.png" \
              http://127.0.0.1:8002/docs || true
          fi
          python - <<'PY'
          from pathlib import Path
          p=Path("docs/screenshots/real-wisconsin-fastapi-docs.png")
          if p.is_file():
              assert p.read_bytes()[:8] == bytes.fromhex("89504e470d0a1a0a")
              print("Actual running-Docker browser screenshot:",p.stat().st_size)
          else:
              print("System Chromium absent; no screenshot generated")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: genuine-wisconsin-train-serve-monitor-contract
          path: |
            runs/ci_demo/train_meta.json
            runs/ci_demo/monitoring_reference.json
            docs/screenshots/*.png
          if-no-files-found: error
