name: Healthcare-ML observed-data lifecycle
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pipeline and test dependencies
        run: |
          pip install -e ".[dev]"
          pip install fastapi "uvicorn>=0.30,<1" "httpx>=0.27,<1"
      - name: Validate data-source contracts and mathematical tests
        run: python -m pytest -q
      - name: Execute full train, held-out evaluation, figure and LaTeX lifecycle
        run: python -m hchealth.run_pipeline --config configs/ci_demo.yaml
      - name: Verify reproducible outputs and source identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path("runs/ci_demo/train_meta.json").read_text())
          result = json.loads(Path("runs/ci_demo/results.json").read_text())
          assert meta["n_train"] + meta["n_test"] == 569
          assert meta["n_features"] == 30
          assert meta["data_source"] == "sklearn Wisconsin Breast Cancer"
          assert meta["positive_label"] == result["positive_label"] == 1
          assert meta["positive_outcome"] == result["positive_outcome"] == "malignant"
          assert meta["n_positive_train"] + meta["n_positive_test"] == 212
          assert result["n_positive_test"] == meta["n_positive_test"]
          assert result["explanation_model_selection"] == "training cross-validation AUROC only"
          assert result["shap_explained_model"] == max(meta["models"], key=lambda n: meta["cv_results"][n]["cv_auroc_mean"])
          assert result["n_test"] == meta["n_test"]
          assert len(meta["models"]) == len(result["models"]) == 5
          for name, measurements in result["models"].items():
              assert 0 <= measurements["AUROC"] <= 1
              assert 0 <= measurements["AUPRC"] <= 1
              assert 0 <= measurements["Brier"] <= 1
          assert Path("paper/ci_results.tex").is_file()
          for name in ("roc.png", "pr.png", "calibration.png", "shap_summary.png", "shap_bar.png"):
              assert (Path("paper/ci_figures") / name).is_file()
          print("Observed Wisconsin Breast Cancer data: training, holdout evaluation, plots, and LaTeX outputs validated")
          PY
      - name: Score actual untouched public Wisconsin holdout using saved model
        run: |
          python - <<'PY'
          from pathlib import Path
          from hchealth.data import load_tabular
          _, heldout, _, _ = load_tabular()
          path = Path("runs/ci_demo/heldout_unlabeled.csv")
          path.parent.mkdir(parents=True, exist_ok=True)
          heldout.to_csv(path, index=False)
          print(f"Original public-source holdout features for inference: {len(heldout)}")
          PY
          python -m hchealth.infer --config configs/ci_demo.yaml --input-csv runs/ci_demo/heldout_unlabeled.csv --output runs/ci_demo/heldout_inference.json
      - name: Independently recheck serialized model's heldout probabilities and source labeling
        run: |
          python - <<'PY'
          import json
          import joblib
          import numpy as np
          import pandas as pd
          from pathlib import Path
          p = Path("runs/ci_demo")
          meta = json.loads((p / "train_meta.json").read_text())
          saved = json.loads((p / "heldout_inference.json").read_text())
          best = max(meta["models"], key=lambda name: meta["cv_results"][name]["cv_auroc_mean"])
          model = joblib.load(p / f"model_{best}.joblib")
          data = pd.read_csv(p / "heldout_unlabeled.csv")
          expected = model.predict_proba(data)[:, list(model.classes_).index(1)]
          observed = np.asarray(saved["probabilities_malignant"])
          assert saved["selected_model"] == best
          assert saved["positive_outcome"] == "malignant" and saved["positive_label"] == 1
          assert saved["n_rows"] == meta["n_test"] == len(data)
          assert saved["n_features"] == meta["n_features"] == data.shape[1] == 30
          assert np.allclose(observed, expected, rtol=0, atol=1e-10)
          assert not saved["clinical_decision_support"]
          assert not saved["external_clinical_validation_established"]
          print(f"Independent saved-model inference verified for {len(data)} heldout original measurements")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wisconsin-breast-cancer-complete-research-lifecycle
          path: |
            runs/ci_demo/train_meta.json
            runs/ci_demo/results.json
            runs/ci_demo/heldout_unlabeled.csv
            runs/ci_demo/heldout_inference.json
            paper/ci_results.tex
            paper/ci_figures/*.png
          if-no-files-found: error
